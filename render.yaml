services:
  - type: web
    name: ipay-telegram-bot
    runtime: docker
    plan: free
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: CHANNEL_URL
        value: https://t.me/Ipay_Official_Channel
      - key: GROUP_URL
        value: https://t.me/ipayvip_1
      - key: CUSTOMER_SERVICE_URL
        value: https://t.me/ipay800
      - key: START_NOW_URL
        value: https://share.ipaynow.net/?data=dWlkPTg5NDIzNSZjaGFubmVsPTEwMDEmYnVzaW5lc3NfaWQ9OTAwMDAy
      - key: COMMISSION
        value: 4%
      - key: REFERRER_REWARD
        value: "50"
      - key: REFERRED_REWARD
        value: "100"
      - key: PORT
        value: "7860"
      - key: DB_PATH
        value: /app/data/ipay.db
